name: Unzip project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restructure
        run: |
          set -e
          ZIP=$(ls *.zip | head -n 1)
          test -n "$ZIP"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name "$ZIP" -exec rm -rf {} +
          unzip -q "$ZIP" -d /tmp/x
          cp -a /tmp/x/slideflow/. .
          rm "$ZIP"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Update from zip"
          git push
