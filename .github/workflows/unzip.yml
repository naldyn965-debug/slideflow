name: Unzip project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restructure
        run: |
          set -e
          test -f slideflow-phase1.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name slideflow-phase1.zip -exec rm -rf {} +
          unzip -q slideflow-phase1.zip -d /tmp/x
          cp -a /tmp/x/slideflow/. .
          rm slideflow-phase1.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore folder structure from zip"
          git push
